<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Menu AR Restaurant - Stable Tracking</title>
  <link rel="stylesheet" href="styles.css">

  <!-- 8th Wall Web SDK -->
  <script async src="//apps.8thwall.com/xrweb?appKey=YOUR_APP_KEY_HERE"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- Custom AR Components -->
  <script src="components.js"></script>
</head>
<body>

  <!-- Instructions overlay -->
  <div id="instructions" class="overlay">
    <div class="instruction-card">
      <h2>🍽️ Menu AR Restaurant</h2>
      <p id="instruction-text">Déplacez votre téléphone pour scanner l'environnement...</p>
      <div id="tracking-quality" class="tracking-badge">Initialisation...</div>
    </div>
  </div>

  <!-- A-Frame AR Scene -->
  <a-scene
    xrweb="allowedDevices: any"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    loading-screen="enabled: false"
    device-orientation-permission-ui="enabled: false"
    ar-hit-test
    ar-tracking-quality>

    <!-- Assets -->
    <a-assets>
      <!-- Placeholder: remplacer par votre modèle 3D -->
      <!-- Exemple: <a-asset-item id="dish-model" src="./models/dish.glb"></a-asset-item> -->
    </a-assets>

    <!-- Camera with cursor -->
    <a-camera
      id="camera"
      position="0 0 0"
      raycaster="objects: .raycastable"
      cursor="rayOrigin: mouse"
      look-controls="enabled: false">
    </a-camera>

    <!-- Lights for realistic rendering -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8; castShadow: true" position="1 4 2"></a-entity>

    <!-- Reticle for placement (placed by ar-hit-test) -->
    <a-entity
      id="reticle"
      visible="false"
      position="0 0 0"
      rotation="-90 0 0">
      <a-ring
        material="shader: flat; color: #00ff00; opacity: 0.7; side: double"
        radius-inner="0.08"
        radius-outer="0.12"
        segments-theta="64">
      </a-ring>
      <a-entity
        geometry="primitive: cylinder; radius: 0.001; height: 0.05"
        material="shader: flat; color: #00ff00; opacity: 0.7"
        rotation="0 0 0">
      </a-entity>
    </a-entity>

    <!-- AR Content Container -->
    <a-entity
      id="ar-content"
      visible="false"
      tap-to-place="reticleId: #reticle"
      pinch-scale="min: 0.5; max: 3.0; initial: 1.0"
      two-finger-rotate
      drag-to-move
      position-smoother="enabled: true; factor: 0.15"
      scale-lock="enabled: true">

      <!-- Modèle 3D du plat - REMPLACER PAR VOTRE MODÈLE -->
      <!-- Option 1: Utiliser un modèle GLB/GLTF -->
      <!-- <a-gltf-model src="#dish-model" position="0 0 0" scale="1 1 1"></a-gltf-model> -->

      <!-- Option 2: Placeholder pour tests - Un simple plat stylisé -->
      <a-entity id="dish-placeholder">
        <!-- Assiette -->
        <a-cylinder
          radius="0.15"
          height="0.02"
          color="#ffffff"
          shadow="cast: true; receive: true"
          position="0 0 0">
        </a-cylinder>

        <!-- Nourriture stylisée (exemple: burger) -->
        <a-entity position="0 0.05 0">
          <!-- Pain du bas -->
          <a-cylinder radius="0.08" height="0.03" color="#d4a574" position="0 0 0"></a-cylinder>
          <!-- Salade -->
          <a-cylinder radius="0.09" height="0.01" color="#5fb850" position="0 0.02 0"></a-cylinder>
          <!-- Steak -->
          <a-cylinder radius="0.085" height="0.025" color="#8b4513" position="0 0.035 0"></a-cylinder>
          <!-- Fromage -->
          <a-cylinder radius="0.09" height="0.01" color="#f4d03f" position="0 0.05 0"></a-cylinder>
          <!-- Pain du haut -->
          <a-sphere radius="0.09" color="#d4a574" position="0 0.08 0" scale="1 0.6 1"></a-sphere>
          <!-- Graine de sésame -->
          <a-sphere radius="0.008" color="#f5e6d3" position="0 0.105 0.03"></a-sphere>
          <a-sphere radius="0.008" color="#f5e6d3" position="0.02 0.105 -0.02"></a-sphere>
          <a-sphere radius="0.008" color="#f5e6d3" position="-0.025 0.105 0.01"></a-sphere>
        </a-entity>

        <!-- Étiquette de prix (optionnel) -->
        <a-entity position="0 0.2 0" rotation="0 0 0">
          <a-plane
            width="0.2"
            height="0.08"
            color="#333333"
            opacity="0.9">
          </a-plane>
          <a-text
            value="Burger Deluxe\n15.99€"
            align="center"
            width="0.35"
            color="#ffffff"
            position="0 0 0.001">
          </a-text>
        </a-entity>
      </a-entity>

      <!-- Shadow plane (optionnel, pour meilleure intégration) -->
      <a-plane
        rotation="-90 0 0"
        width="0.5"
        height="0.5"
        material="shader: shadow; opacity: 0.4"
        shadow="receive: true"
        position="0 0.001 0">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    // Update instruction text based on placement state
    window.addEventListener('model-placed', () => {
      const instructionText = document.getElementById('instruction-text');
      instructionText.innerHTML = `
        ✅ <strong>Modèle placé!</strong><br>
        • Pincez pour zoomer/dézoomer<br>
        • 2 doigts rotation pour pivoter<br>
        • Maintenez et glissez pour déplacer
      `;
    });

    // Update tracking quality display
    window.addEventListener('tracking-quality-change', (e) => {
      const badge = document.getElementById('tracking-quality');
      const quality = e.detail.quality;

      badge.className = 'tracking-badge tracking-' + quality;

      const qualityText = {
        'limited': '⚠️ Qualité limitée',
        'normal': '✓ Tracking OK',
        'good': '✓ Bon tracking'
      };

      badge.textContent = qualityText[quality] || 'Initialisation...';
    });

    // Hide instructions after 10 seconds if model is placed
    let instructionsTimeout;
    window.addEventListener('model-placed', () => {
      clearTimeout(instructionsTimeout);
      instructionsTimeout = setTimeout(() => {
        const overlay = document.getElementById('instructions');
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 500);
      }, 10000);
    });

    // Tap to show/hide instructions
    document.addEventListener('dblclick', () => {
      const overlay = document.getElementById('instructions');
      if (overlay.style.display === 'none') {
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
      } else {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 500);
      }
    });
  </script>

</body>
</html>
